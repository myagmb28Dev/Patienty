name: Render Free Instance Keep-Alive

on:
  schedule:
    # 10분마다 실행하여 Render Free 플랜의 15분 인액티브 슬립을 방지
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Patienty Backend..."
          curl -s -f -m 30 https://patienty-backend.onrender.com/actuator/health || echo "Backend ping returned status $?"

      - name: Ping Frontend
        run: |
          echo "Pinging Patienty Frontend..."
          curl -s -f -m 30 https://patienty-frontend.onrender.com/login || echo "Frontend ping returned status $?"
