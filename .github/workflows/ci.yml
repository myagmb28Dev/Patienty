name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        if: hashFiles('backend/gradlew') != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run backend checks
        if: hashFiles('backend/gradlew') != ''
        working-directory: backend
        run: ./gradlew build --no-daemon

      - name: Report pending backend setup
        if: hashFiles('backend/gradlew') == ''
        run: echo "Backend project has not been initialized yet."

  frontend-ci:
    name: Frontend CI
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: hashFiles('frontend/package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run lint --if-present

      - name: Check frontend types
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run type-check --if-present

      - name: Test frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm test --if-present

      - name: Build frontend
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: npm run build

      - name: Report pending frontend setup
        if: hashFiles('frontend/package-lock.json') == ''
        run: echo "Frontend project has not been initialized yet."
