spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    hikari:
      minimum-idle: 0
      maximum-pool-size: 5
      keepalive-time: 0
      idle-timeout: 60000
  flyway:
    locations: classpath:db/migration

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${PATIENTY_SESSION_COOKIE_SECURE:true}
        same-site: ${PATIENTY_SESSION_COOKIE_SAME_SITE:none}

patienty:
  cors:
    allowed-origins: ${PATIENTY_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
