spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
  flyway:
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        secure: ${PATIENTY_SESSION_COOKIE_SECURE:true}
        same-site: ${PATIENTY_SESSION_COOKIE_SAME_SITE:none}

patienty:
  cors:
    allowed-origins: ${PATIENTY_CORS_ALLOWED_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
