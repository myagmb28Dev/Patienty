spring:
  application:
    name: patienty-backend
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patienty}
    username: ${SPRING_DATASOURCE_USERNAME:patienty}
    password: ${SPRING_DATASOURCE_PASSWORD:patienty}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${PATIENTY_SESSION_COOKIE_SECURE:false}
        same-site: ${PATIENTY_SESSION_COOKIE_SAME_SITE:lax}
      timeout: 8h

patienty:
  ai:
    provider: ${PATIENTY_AI_PROVIDER:openrouter}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${PATIENTY_AI_OPENROUTER_MODEL:google/gemini-2.0-flash-001}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  cors:
    allowed-origins: ${PATIENTY_CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
